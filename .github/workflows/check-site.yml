name: Check learning site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_site.py
      - run: node --test tests/*.test.cjs
      - run: |
          node --check site/assets/reading.js
          node --check site/assets/home.js
          node --check site/assets/progress.js
