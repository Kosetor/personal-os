<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal OS Learning</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --accent:#3fb950; }
  * { margin:0; box-sizing:border-box; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg);
         min-height:100vh; display:flex; flex-direction:column; justify-content:center;
         align-items:center; padding:24px; }
  .wrap { max-width:640px; text-align:center; }
  h1 { font-size:28px; margin-bottom:8px; letter-spacing:.02em; }
  .tag { color:var(--accent); font-size:13px; text-transform:uppercase;
         letter-spacing:.18em; margin-bottom:16px; }
  p { color:#8b949e; line-height:1.6; }
  .status { margin-top:24px; padding:10px 16px; border:1px solid #30363d;
            border-radius:8px; font-size:14px; color:#8b949e; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">Personal OS Learning</div>
  <h1>Система обучения управленческим навыкам</h1>
  <p>Статья дня, адаптивные тесты (FSRS) и граф прогрессии появятся здесь после
     первого пилотного прогона.</p>
  <div class="status">🔧 Идёт настройка системы</div>
</div>
</body>
</html>
