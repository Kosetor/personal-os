<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 666" font-family="system-ui,sans-serif">
<rect width="700" height="666" fill="#0d1117"/>
<text x="350.0" y="34" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PERSONAL OS · КЛЮЧЕВЫЕ ТЕЗИСЫ</text>
<text x="350.0" y="52" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">Управление командой и роли</text>
<rect x="28" y="68" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="68" width="6" height="82" fill="#3fb950" rx="3"/>
<circle cx="58" cy="109.0" r="13" fill="none" stroke="#3fb950" stroke-width="1.5"/>
<text x="58" y="113.5" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="84" y="93.0" fill="#c9d1d9" font-size="13.5">Команда отличается от группы наличием общей цели, взаимной ответственности и</text>
<text x="84" y="113.0" fill="#c9d1d9" font-size="13.5">распределённых ролей; не всякая группа должна быть командой — для рутинных</text>
<text x="84" y="133.0" fill="#c9d1d9" font-size="13.5">процессов достаточно формальной структуры.</text>
<rect x="28" y="162" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="162" width="6" height="82" fill="#1f6feb" rx="3"/>
<circle cx="58" cy="203.0" r="13" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
<text x="58" y="207.5" fill="#1f6feb" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="84" y="187.0" fill="#c9d1d9" font-size="13.5">Роли бывают формальными (закреплены в должностном регламенте) и неформальными</text>
<text x="84" y="207.0" fill="#c9d1d9" font-size="13.5">(поведенческие паттерны); эффективная команда требует баланса ролей, а</text>
<text x="84" y="227.0" fill="#c9d1d9" font-size="13.5">руководитель должен учитывать их при распределении задач.</text>
<rect x="28" y="256" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="256" width="6" height="82" fill="#d4a017" rx="3"/>
<circle cx="58" cy="297.0" r="13" fill="none" stroke="#d4a017" stroke-width="1.5"/>
<text x="58" y="301.5" fill="#d4a017" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text x="84" y="281.0" fill="#c9d1d9" font-size="13.5">Команда проходит этапы формирования, шторма, нормирования, функционирования и</text>
<text x="84" y="301.0" fill="#c9d1d9" font-size="13.5">трансформации; конфликты на этапе шторма — норма, а не катастрофа, и ими нужно</text>
<text x="84" y="321.0" fill="#c9d1d9" font-size="13.5">управлять.</text>
<rect x="28" y="350" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="350" width="6" height="82" fill="#bc8cff" rx="3"/>
<circle cx="58" cy="391.0" r="13" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
<text x="58" y="395.5" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">4</text>
<text x="84" y="375.0" fill="#c9d1d9" font-size="13.5">Ключевые инструменты управления командой — конкретное целеполагание, матрица</text>
<text x="84" y="395.0" fill="#c9d1d9" font-size="13.5">ответственности, регулярная развивающая обратная связь и нематериальная</text>
<text x="84" y="415.0" fill="#c9d1d9" font-size="13.5">мотивация.</text>
<rect x="28" y="444" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="444" width="6" height="82" fill="#f0883e" rx="3"/>
<circle cx="58" cy="485.0" r="13" fill="none" stroke="#f0883e" stroke-width="1.5"/>
<text x="58" y="489.5" fill="#f0883e" font-size="13" font-weight="700" text-anchor="middle">5</text>
<text x="84" y="469.0" fill="#c9d1d9" font-size="13.5">Специфика госслужбы — иерархия, нормативная зарегулированность, ограниченные</text>
<text x="84" y="489.0" fill="#c9d1d9" font-size="13.5">кадровые возможности и высокая текучесть — требует гибкости и системной работы</text>
<text x="84" y="509.0" fill="#c9d1d9" font-size="13.5">с теми ресурсами, которые есть.</text>
<rect x="28" y="538" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="538" width="6" height="82" fill="#39c5cf" rx="3"/>
<circle cx="58" cy="579.0" r="13" fill="none" stroke="#39c5cf" stroke-width="1.5"/>
<text x="58" y="583.5" fill="#39c5cf" font-size="13" font-weight="700" text-anchor="middle">6</text>
<text x="84" y="563.0" fill="#c9d1d9" font-size="13.5">Типичные ошибки руководителя — одинаковый подход ко всем сотрудникам,</text>
<text x="84" y="583.0" fill="#c9d1d9" font-size="13.5">подавление конфликтов, избыточная отчётность и отсутствие делегирования —</text>
<text x="84" y="603.0" fill="#c9d1d9" font-size="13.5">преодолимы при осознанном применении простых управленческих инструментов.</text>
<text x="350.0" y="656" fill="#8b949e" font-size="11" text-anchor="middle">Personal OS Learning · управленческие навыки госслужащего</text>
</svg>