<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 644" font-family="system-ui,sans-serif">
<rect width="700" height="644" fill="#0d1117"/>
<text x="350.0" y="34" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PERSONAL OS · КЛЮЧЕВЫЕ ТЕЗИСЫ</text>
<text x="350.0" y="52" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">Этика госслужащего и антикоррупционные</text>
<text x="350.0" y="72" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">стандарты</text>
<rect x="28" y="86" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="86" width="6" height="82" fill="#3fb950" rx="3"/>
<circle cx="58" cy="127.0" r="13" fill="none" stroke="#3fb950" stroke-width="1.5"/>
<text x="58" y="131.5" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="84" y="111.0" fill="#c9d1d9" font-size="13.5">Красные линии: Существуют жесткие законодательные запреты (подарки,</text>
<text x="84" y="131.0" fill="#c9d1d9" font-size="13.5">совместительство, конфликт интересов), нарушение которых влечет увольнение в</text>
<text x="84" y="151.0" fill="#c9d1d9" font-size="13.5">связи с утратой доверия.</text>
<rect x="28" y="180" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="180" width="6" height="82" fill="#1f6feb" rx="3"/>
<circle cx="58" cy="221.0" r="13" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
<text x="58" y="225.5" fill="#1f6feb" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="84" y="205.0" fill="#c9d1d9" font-size="13.5">Уведомил — защитился: Самостоятельное уведомление о конфликте интересов или</text>
<text x="84" y="225.0" fill="#c9d1d9" font-size="13.5">склонении к коррупции — это единственный законный способ снять с себя</text>
<text x="84" y="245.0" fill="#c9d1d9" font-size="13.5">ответственность и обезопасить карьеру.</text>
<rect x="28" y="274" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="274" width="6" height="82" fill="#d4a017" rx="3"/>
<circle cx="58" cy="315.0" r="13" fill="none" stroke="#d4a017" stroke-width="1.5"/>
<text x="58" y="319.5" fill="#d4a017" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text x="84" y="299.0" fill="#c9d1d9" font-size="13.5">Этикет — это безопасность: Формально-вежливый, эмоционально-нейтральный стиль</text>
<text x="84" y="319.0" fill="#c9d1d9" font-size="13.5">общения и открытое рабочее пространство снижают коррупционные риски и защищают</text>
<text x="84" y="339.0" fill="#c9d1d9" font-size="13.5">от провокаций.</text>
<rect x="28" y="368" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="368" width="6" height="82" fill="#bc8cff" rx="3"/>
<circle cx="58" cy="409.0" r="13" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
<text x="58" y="413.5" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">4</text>
<text x="84" y="393.0" fill="#c9d1d9" font-size="13.5">Цифровая гигиена: Ваши аккаунты в соцсетях — часть антикоррупционной проверки.</text>
<text x="84" y="413.0" fill="#c9d1d9" font-size="13.5">Требования к доходам распространяются и на виртуальную демонстрацию уровня</text>
<text x="84" y="433.0" fill="#c9d1d9" font-size="13.5">жизни.</text>
<rect x="28" y="462" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="462" width="6" height="62" fill="#f0883e" rx="3"/>
<circle cx="58" cy="493.0" r="13" fill="none" stroke="#f0883e" stroke-width="1.5"/>
<text x="58" y="497.5" fill="#f0883e" font-size="13" font-weight="700" text-anchor="middle">5</text>
<text x="84" y="487.0" fill="#c9d1d9" font-size="13.5">Стерильность: Полный отказ от подарков и любых неформальных знаков внимания</text>
<text x="84" y="507.0" fill="#c9d1d9" font-size="13.5">исключает двусмысленности и укрепляет репутацию неподкупного специалиста.</text>
<rect x="28" y="536" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="536" width="6" height="62" fill="#39c5cf" rx="3"/>
<circle cx="58" cy="567.0" r="13" fill="none" stroke="#39c5cf" stroke-width="1.5"/>
<text x="58" y="571.5" fill="#39c5cf" font-size="13" font-weight="700" text-anchor="middle">6</text>
<text x="84" y="561.0" fill="#c9d1d9" font-size="13.5">Процедура — ваша броня: В спорной ситуации выбирайте документированный,</text>
<text x="84" y="581.0" fill="#c9d1d9" font-size="13.5">официальный путь решения, а не личные договоренности.</text>
<text x="350.0" y="634" fill="#8b949e" font-size="11" text-anchor="middle">Personal OS Learning · управленческие навыки госслужащего</text>
</svg>