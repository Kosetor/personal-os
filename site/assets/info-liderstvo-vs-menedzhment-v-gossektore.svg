<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 606" font-family="system-ui,sans-serif">
<rect width="700" height="606" fill="#0d1117"/>
<text x="350.0" y="34" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PERSONAL OS · КЛЮЧЕВЫЕ ТЕЗИСЫ</text>
<text x="350.0" y="52" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">Лидерство vs менеджмент в госсекторе</text>
<rect x="28" y="68" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="68" width="6" height="82" fill="#3fb950" rx="3"/>
<circle cx="58" cy="109.0" r="13" fill="none" stroke="#3fb950" stroke-width="1.5"/>
<text x="58" y="113.5" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="84" y="93.0" fill="#c9d1d9" font-size="13.5">Менеджмент — это база, лидерство — это надстройка: Менеджмент обеспечивает</text>
<text x="84" y="113.0" fill="#c9d1d9" font-size="13.5">порядок и законность, лидерство — развитие и эффективность. В госслужбе они</text>
<text x="84" y="133.0" fill="#c9d1d9" font-size="13.5">неразделимы.</text>
<rect x="28" y="162" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="162" width="6" height="62" fill="#1f6feb" rx="3"/>
<circle cx="58" cy="193.0" r="13" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
<text x="58" y="197.5" fill="#1f6feb" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="84" y="187.0" fill="#c9d1d9" font-size="13.5">Лидерство не зависит от должности: Проявлять инициативу, влиять на коллег и</text>
<text x="84" y="207.0" fill="#c9d1d9" font-size="13.5">создавать смыслы можно на любом уровне, даже не имея подчиненных.</text>
<rect x="28" y="236" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="236" width="6" height="62" fill="#d4a017" rx="3"/>
<circle cx="58" cy="267.0" r="13" fill="none" stroke="#d4a017" stroke-width="1.5"/>
<text x="58" y="271.5" fill="#d4a017" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text x="84" y="261.0" fill="#c9d1d9" font-size="13.5">Главный инструмент лидера — личный пример: Сотрудники всегда будут</text>
<text x="84" y="281.0" fill="#c9d1d9" font-size="13.5">ориентироваться на действия, а не на слова руководителя.</text>
<rect x="28" y="310" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="310" width="6" height="62" fill="#bc8cff" rx="3"/>
<circle cx="58" cy="341.0" r="13" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
<text x="58" y="345.5" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">4</text>
<text x="84" y="335.0" fill="#c9d1d9" font-size="13.5">Лидерство — это про изменение рамок: Это способность увидеть за жестким</text>
<text x="84" y="355.0" fill="#c9d1d9" font-size="13.5">регламентом человеческую цель и найти законный способ сделать процесс лучше.</text>
<rect x="28" y="384" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="384" width="6" height="82" fill="#f0883e" rx="3"/>
<circle cx="58" cy="425.0" r="13" fill="none" stroke="#f0883e" stroke-width="1.5"/>
<text x="58" y="429.5" fill="#f0883e" font-size="13" font-weight="700" text-anchor="middle">5</text>
<text x="84" y="409.0" fill="#c9d1d9" font-size="13.5">Развитие лидерских компетенций — это практика: Нельзя стать лидером, прочитав</text>
<text x="84" y="429.0" fill="#c9d1d9" font-size="13.5">книгу. Это ежедневная работа над собой: над своими вопросами, реакциями и</text>
<text x="84" y="449.0" fill="#c9d1d9" font-size="13.5">отношением к делу.</text>
<rect x="28" y="478" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="478" width="6" height="82" fill="#39c5cf" rx="3"/>
<circle cx="58" cy="519.0" r="13" fill="none" stroke="#39c5cf" stroke-width="1.5"/>
<text x="58" y="523.5" fill="#39c5cf" font-size="13" font-weight="700" text-anchor="middle">6</text>
<text x="84" y="503.0" fill="#c9d1d9" font-size="13.5">Вовлеченность рождается из сопричастности: Когда вы позволяете команде</text>
<text x="84" y="523.0" fill="#c9d1d9" font-size="13.5">участвовать в принятии решений, вы растите не исполнителей, а</text>
<text x="84" y="543.0" fill="#c9d1d9" font-size="13.5">единомышленников, которые берут на себя ответственность за общий результат.</text>
<text x="350.0" y="596" fill="#8b949e" font-size="11" text-anchor="middle">Personal OS Learning · управленческие навыки госслужащего</text>
</svg>