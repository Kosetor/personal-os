<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 566" font-family="system-ui,sans-serif">
<rect width="700" height="566" fill="#0d1117"/>
<text x="350.0" y="34" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PERSONAL OS · КЛЮЧЕВЫЕ ТЕЗИСЫ</text>
<text x="350.0" y="52" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">Административные регламенты и услуги</text>
<rect x="28" y="68" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="68" width="6" height="62" fill="#3fb950" rx="3"/>
<circle cx="58" cy="99.0" r="13" fill="none" stroke="#3fb950" stroke-width="1.5"/>
<text x="58" y="103.5" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="84" y="93.0" fill="#c9d1d9" font-size="13.5">Регламент = публичный договор: он защищает и заявителя, и госслужащего,</text>
<text x="84" y="113.0" fill="#c9d1d9" font-size="13.5">фиксируя сроки, состав документов и основания для отказа.</text>
<rect x="28" y="142" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="142" width="6" height="62" fill="#1f6feb" rx="3"/>
<circle cx="58" cy="173.0" r="13" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
<text x="58" y="177.5" fill="#1f6feb" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="84" y="167.0" fill="#c9d1d9" font-size="13.5">Стандарт услуги — это сердце регламента: именно раздел о стандарте заявитель</text>
<text x="84" y="187.0" fill="#c9d1d9" font-size="13.5">использует для контроля ваших действий.</text>
<rect x="28" y="216" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="216" width="6" height="62" fill="#d4a017" rx="3"/>
<circle cx="58" cy="247.0" r="13" fill="none" stroke="#d4a017" stroke-width="1.5"/>
<text x="58" y="251.5" fill="#d4a017" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text x="84" y="241.0" fill="#c9d1d9" font-size="13.5">Знание 210-ФЗ — обязательный минимум: базовый закон о госуслугах имеет</text>
<text x="84" y="261.0" fill="#c9d1d9" font-size="13.5">приоритет над ведомственными регламентами.</text>
<rect x="28" y="290" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="290" width="6" height="82" fill="#bc8cff" rx="3"/>
<circle cx="58" cy="331.0" r="13" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
<text x="58" y="335.5" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">4</text>
<text x="84" y="315.0" fill="#c9d1d9" font-size="13.5">Нельзя требовать документы, не предусмотренные регламентом, — это прямое</text>
<text x="84" y="335.0" fill="#c9d1d9" font-size="13.5">нарушение, которое влечет административную ответственность по ст. 5.63 КоАП</text>
<text x="84" y="355.0" fill="#c9d1d9" font-size="13.5">РФ.</text>
<rect x="28" y="384" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="384" width="6" height="62" fill="#f0883e" rx="3"/>
<circle cx="58" cy="415.0" r="13" fill="none" stroke="#f0883e" stroke-width="1.5"/>
<text x="58" y="419.5" fill="#f0883e" font-size="13" font-weight="700" text-anchor="middle">5</text>
<text x="84" y="409.0" fill="#c9d1d9" font-size="13.5">Цифровизация не отменяет регламенты, а усиливает контроль: электронные системы</text>
<text x="84" y="429.0" fill="#c9d1d9" font-size="13.5">фиксируют каждый шаг, поэтому «забыть» о заявлении невозможно.</text>
<rect x="28" y="458" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="458" width="6" height="62" fill="#39c5cf" rx="3"/>
<circle cx="58" cy="489.0" r="13" fill="none" stroke="#39c5cf" stroke-width="1.5"/>
<text x="58" y="493.5" fill="#39c5cf" font-size="13" font-weight="700" text-anchor="middle">6</text>
<text x="84" y="483.0" fill="#c9d1d9" font-size="13.5">Работа с регламентом — это навык: регулярная актуализация знаний и</text>
<text x="84" y="503.0" fill="#c9d1d9" font-size="13.5">самопроверка по чек-листу снижают риски нарушений и повышают качество услуг.</text>
<text x="350.0" y="556" fill="#8b949e" font-size="11" text-anchor="middle">Personal OS Learning · управленческие навыки госслужащего</text>
</svg>