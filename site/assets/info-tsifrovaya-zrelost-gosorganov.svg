<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 606" font-family="system-ui,sans-serif">
<rect width="700" height="606" fill="#0d1117"/>
<text x="350.0" y="34" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PERSONAL OS · КЛЮЧЕВЫЕ ТЕЗИСЫ</text>
<text x="350.0" y="52" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">Цифровая зрелость госорганов</text>
<rect x="28" y="68" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="68" width="6" height="82" fill="#3fb950" rx="3"/>
<circle cx="58" cy="109.0" r="13" fill="none" stroke="#3fb950" stroke-width="1.5"/>
<text x="58" y="113.5" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="84" y="93.0" fill="#c9d1d9" font-size="13.5">Цифровая зрелость — это готовность органа власти эффективно использовать</text>
<text x="84" y="113.0" fill="#c9d1d9" font-size="13.5">технологии в процессах, данных и компетенциях сотрудников, а не просто наличие</text>
<text x="84" y="133.0" fill="#c9d1d9" font-size="13.5">ПО.</text>
<rect x="28" y="162" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="162" width="6" height="82" fill="#1f6feb" rx="3"/>
<circle cx="58" cy="203.0" r="13" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
<text x="58" y="207.5" fill="#1f6feb" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="84" y="187.0" fill="#c9d1d9" font-size="13.5">Уровень цифровой зрелости оценивается по конкретным показателям: доля</text>
<text x="84" y="207.0" fill="#c9d1d9" font-size="13.5">электронных услуг, электронный документооборот, использование СМЭВ,</text>
<text x="84" y="227.0" fill="#c9d1d9" font-size="13.5">удовлетворённость граждан.</text>
<rect x="28" y="256" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="256" width="6" height="62" fill="#d4a017" rx="3"/>
<circle cx="58" cy="287.0" r="13" fill="none" stroke="#d4a017" stroke-width="1.5"/>
<text x="58" y="291.5" fill="#d4a017" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text x="84" y="281.0" fill="#c9d1d9" font-size="13.5">Каждый госслужащий влияет на цифровую зрелость через свою повседневную работу:</text>
<text x="84" y="301.0" fill="#c9d1d9" font-size="13.5">от работы в СЭД до консультирования граждан по онлайн-сервисам.</text>
<rect x="28" y="330" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="330" width="6" height="62" fill="#bc8cff" rx="3"/>
<circle cx="58" cy="361.0" r="13" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
<text x="58" y="365.5" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">4</text>
<text x="84" y="355.0" fill="#c9d1d9" font-size="13.5">Главный барьер цифровой трансформации — человеческий фактор, а не технологии;</text>
<text x="84" y="375.0" fill="#c9d1d9" font-size="13.5">преодолевается обучением, наставничеством и измеримыми целями.</text>
<rect x="28" y="404" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="404" width="6" height="62" fill="#f0883e" rx="3"/>
<circle cx="58" cy="435.0" r="13" fill="none" stroke="#f0883e" stroke-width="1.5"/>
<text x="58" y="439.5" fill="#f0883e" font-size="13" font-weight="700" text-anchor="middle">5</text>
<text x="84" y="429.0" fill="#c9d1d9" font-size="13.5">Практические инструменты повышения зрелости: карта процессов, чек-лист</text>
<text x="84" y="449.0" fill="#c9d1d9" font-size="13.5">«электронного» исполнения, работа с обратной связью, аналитика из СЭД.</text>
<rect x="28" y="478" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="478" width="6" height="82" fill="#39c5cf" rx="3"/>
<circle cx="58" cy="519.0" r="13" fill="none" stroke="#39c5cf" stroke-width="1.5"/>
<text x="58" y="523.5" fill="#39c5cf" font-size="13" font-weight="700" text-anchor="middle">6</text>
<text x="84" y="503.0" fill="#c9d1d9" font-size="13.5">Начать повышать цифровую зрелость можно с одного процесса: устранить лишнюю</text>
<text x="84" y="523.0" fill="#c9d1d9" font-size="13.5">справку, перевести согласование в электронный вид, автоматизировать ручную</text>
<text x="84" y="543.0" fill="#c9d1d9" font-size="13.5">передачу данных.</text>
<text x="350.0" y="596" fill="#8b949e" font-size="11" text-anchor="middle">Personal OS Learning · управленческие навыки госслужащего</text>
</svg>