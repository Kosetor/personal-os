<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 626" font-family="system-ui,sans-serif">
<rect width="700" height="626" fill="#0d1117"/>
<text x="350.0" y="34" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PERSONAL OS · КЛЮЧЕВЫЕ ТЕЗИСЫ</text>
<text x="350.0" y="52" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">Структура и полномочия органов власти</text>
<rect x="28" y="68" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="68" width="6" height="82" fill="#3fb950" rx="3"/>
<circle cx="58" cy="109.0" r="13" fill="none" stroke="#3fb950" stroke-width="1.5"/>
<text x="58" y="113.5" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="84" y="93.0" fill="#c9d1d9" font-size="13.5">Три ветви власти — законодательная, исполнительная и судебная — работают на</text>
<text x="84" y="113.0" fill="#c9d1d9" font-size="13.5">основе принципа разделения властей, а Президент РФ занимает особое положение</text>
<text x="84" y="133.0" fill="#c9d1d9" font-size="13.5">гаранта Конституции.</text>
<rect x="28" y="162" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="162" width="6" height="82" fill="#1f6feb" rx="3"/>
<circle cx="58" cy="203.0" r="13" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
<text x="58" y="207.5" fill="#1f6feb" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="84" y="187.0" fill="#c9d1d9" font-size="13.5">Два уровня государственной власти — федеральный и региональный — дополняются</text>
<text x="84" y="207.0" fill="#c9d1d9" font-size="13.5">местным самоуправлением, которое формально не входит в систему госвласти, но</text>
<text x="84" y="227.0" fill="#c9d1d9" font-size="13.5">активно взаимодействует с ней.</text>
<rect x="28" y="256" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="256" width="6" height="62" fill="#d4a017" rx="3"/>
<circle cx="58" cy="287.0" r="13" fill="none" stroke="#d4a017" stroke-width="1.5"/>
<text x="58" y="291.5" fill="#d4a017" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text x="84" y="281.0" fill="#c9d1d9" font-size="13.5">Разграничение полномочий определяется Конституцией РФ и федеральными законами,</text>
<text x="84" y="301.0" fill="#c9d1d9" font-size="13.5">а не ведомственными предпочтениями или сложившейся практикой.</text>
<rect x="28" y="330" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="330" width="6" height="62" fill="#bc8cff" rx="3"/>
<circle cx="58" cy="361.0" r="13" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
<text x="58" y="365.5" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">4</text>
<text x="84" y="355.0" fill="#c9d1d9" font-size="13.5">Три вида полномочий — исключительные федеральные, совместного ведения и</text>
<text x="84" y="375.0" fill="#c9d1d9" font-size="13.5">региональные — требуют четкого понимания при решении каждого вопроса.</text>
<rect x="28" y="404" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="404" width="6" height="82" fill="#f0883e" rx="3"/>
<circle cx="58" cy="445.0" r="13" fill="none" stroke="#f0883e" stroke-width="1.5"/>
<text x="58" y="449.5" fill="#f0883e" font-size="13" font-weight="700" text-anchor="middle">5</text>
<text x="84" y="429.0" fill="#c9d1d9" font-size="13.5">Практический алгоритм определения компетенции включает анализ нормативной</text>
<text x="84" y="449.0" fill="#c9d1d9" font-size="13.5">базы, проверку реестров функций и услуг, а также консультацию с судебной</text>
<text x="84" y="469.0" fill="#c9d1d9" font-size="13.5">практикой.</text>
<rect x="28" y="498" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="498" width="6" height="82" fill="#39c5cf" rx="3"/>
<circle cx="58" cy="539.0" r="13" fill="none" stroke="#39c5cf" stroke-width="1.5"/>
<text x="58" y="543.5" fill="#39c5cf" font-size="13" font-weight="700" text-anchor="middle">6</text>
<text x="84" y="523.0" fill="#c9d1d9" font-size="13.5">Типичные ошибки — смешение «ведения» и «полномочий», игнорирование</text>
<text x="84" y="543.0" fill="#c9d1d9" font-size="13.5">делегированных полномочий и путаница между государственными и муниципальными</text>
<text x="84" y="563.0" fill="#c9d1d9" font-size="13.5">услугами — приводят к затягиванию решений и коррупционным рискам.</text>
<text x="350.0" y="616" fill="#8b949e" font-size="11" text-anchor="middle">Personal OS Learning · управленческие навыки госслужащего</text>
</svg>