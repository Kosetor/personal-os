<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 566" font-family="system-ui,sans-serif">
<rect width="700" height="566" fill="#0d1117"/>
<text x="350.0" y="34" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PERSONAL OS · КЛЮЧЕВЫЕ ТЕЗИСЫ</text>
<text x="350.0" y="52" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">Анализ рисков</text>
<rect x="28" y="68" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="68" width="6" height="62" fill="#3fb950" rx="3"/>
<circle cx="58" cy="99.0" r="13" fill="none" stroke="#3fb950" stroke-width="1.5"/>
<text x="58" y="103.5" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="84" y="93.0" fill="#c9d1d9" font-size="13.5">Риск — это измеримая величина. Уровень риска = Вероятность × Последствия. Без</text>
<text x="84" y="113.0" fill="#c9d1d9" font-size="13.5">цифровой оценки управление рисками превращается в гадание.</text>
<rect x="28" y="142" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="142" width="6" height="62" fill="#1f6feb" rx="3"/>
<circle cx="58" cy="173.0" r="13" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
<text x="58" y="177.5" fill="#1f6feb" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="84" y="167.0" fill="#c9d1d9" font-size="13.5">Главная специфика госсектора — приоритет социальных и репутационных</text>
<text x="84" y="187.0" fill="#c9d1d9" font-size="13.5">последствий над чисто финансовыми потерями.</text>
<rect x="28" y="216" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="216" width="6" height="62" fill="#d4a017" rx="3"/>
<circle cx="58" cy="247.0" r="13" fill="none" stroke="#d4a017" stroke-width="1.5"/>
<text x="58" y="251.5" fill="#d4a017" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text x="84" y="241.0" fill="#c9d1d9" font-size="13.5">Реестр рисков — обязательный инструмент руководителя. Он превращает «страхи» в</text>
<text x="84" y="261.0" fill="#c9d1d9" font-size="13.5">перечень задач с ответственными и сроками.</text>
<rect x="28" y="290" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="290" width="6" height="62" fill="#bc8cff" rx="3"/>
<circle cx="58" cy="321.0" r="13" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
<text x="58" y="325.5" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">4</text>
<text x="84" y="315.0" fill="#c9d1d9" font-size="13.5">Метод «Дерево решений» помогает сравнивать альтернативы и выбирать вариант с</text>
<text x="84" y="335.0" fill="#c9d1d9" font-size="13.5">наименьшими ожидаемыми потерями.</text>
<rect x="28" y="364" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="364" width="6" height="62" fill="#f0883e" rx="3"/>
<circle cx="58" cy="395.0" r="13" fill="none" stroke="#f0883e" stroke-width="1.5"/>
<text x="58" y="399.5" fill="#f0883e" font-size="13" font-weight="700" text-anchor="middle">5</text>
<text x="84" y="389.0" fill="#c9d1d9" font-size="13.5">Анализ рисков не отменяет неопределенность, но позволяет заранее подготовить</text>
<text x="84" y="409.0" fill="#c9d1d9" font-size="13.5">меры реагирования на негативные сценарии.</text>
<rect x="28" y="438" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="438" width="6" height="82" fill="#39c5cf" rx="3"/>
<circle cx="58" cy="479.0" r="13" fill="none" stroke="#39c5cf" stroke-width="1.5"/>
<text x="58" y="483.5" fill="#39c5cf" font-size="13" font-weight="700" text-anchor="middle">6</text>
<text x="84" y="463.0" fill="#c9d1d9" font-size="13.5">Документальное оформление рисков (паспорт, реестр, раздел в докладной) — это</text>
<text x="84" y="483.0" fill="#c9d1d9" font-size="13.5">способ коммуникации с руководством и контролирующими органами, а не</text>
<text x="84" y="503.0" fill="#c9d1d9" font-size="13.5">формальность.</text>
<text x="350.0" y="556" fill="#8b949e" font-size="11" text-anchor="middle">Personal OS Learning · управленческие навыки госслужащего</text>
</svg>