<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 666" font-family="system-ui,sans-serif">
<rect width="700" height="666" fill="#0d1117"/>
<text x="350.0" y="34" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PERSONAL OS · КЛЮЧЕВЫЕ ТЕЗИСЫ</text>
<text x="350.0" y="52" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">Коммуникация с гражданами и обратная связь</text>
<rect x="28" y="68" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="68" width="6" height="62" fill="#3fb950" rx="3"/>
<circle cx="58" cy="99.0" r="13" fill="none" stroke="#3fb950" stroke-width="1.5"/>
<text x="58" y="103.5" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="84" y="93.0" fill="#c9d1d9" font-size="13.5">Клиентоцентричность — норма: Госслужащий должен воспринимать гражданина не как</text>
<text x="84" y="113.0" fill="#c9d1d9" font-size="13.5">просителя, а как клиента, нуждающегося в качественной услуге.</text>
<rect x="28" y="142" width="644" height="102" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="142" width="6" height="102" fill="#1f6feb" rx="3"/>
<circle cx="58" cy="193.0" r="13" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
<text x="58" y="197.5" fill="#1f6feb" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="84" y="167.0" fill="#c9d1d9" font-size="13.5">Закон — основа: Работа с обращениями строго регламентирована (Федеральный</text>
<text x="84" y="187.0" fill="#c9d1d9" font-size="13.5">закон от 02.05.2006 № 59-ФЗ «О порядке рассмотрения обращений граждан</text>
<text x="84" y="207.0" fill="#c9d1d9" font-size="13.5">Российской Федерации»), нарушение сроков и порядка — это дисциплинарный</text>
<text x="84" y="227.0" fill="#c9d1d9" font-size="13.5">проступок.</text>
<rect x="28" y="256" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="256" width="6" height="82" fill="#d4a017" rx="3"/>
<circle cx="58" cy="297.0" r="13" fill="none" stroke="#d4a017" stroke-width="1.5"/>
<text x="58" y="301.5" fill="#d4a017" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text x="84" y="281.0" fill="#c9d1d9" font-size="13.5">Слышать, а не слушать: Применение техник активного слушания (уточнение,</text>
<text x="84" y="301.0" fill="#c9d1d9" font-size="13.5">перефразирование) позволяет выявить истинную суть проблемы и снизить накал</text>
<text x="84" y="321.0" fill="#c9d1d9" font-size="13.5">эмоций.</text>
<rect x="28" y="350" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="350" width="6" height="82" fill="#bc8cff" rx="3"/>
<circle cx="58" cy="391.0" r="13" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
<text x="58" y="395.5" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">4</text>
<text x="84" y="375.0" fill="#c9d1d9" font-size="13.5">Принцип «Сначала вывод»: Ответ должен начинаться с решения или главной мысли,</text>
<text x="84" y="395.0" fill="#c9d1d9" font-size="13.5">а не с длинного юридического обоснования. Простой язык — признак уважения к</text>
<text x="84" y="415.0" fill="#c9d1d9" font-size="13.5">собеседнику.</text>
<rect x="28" y="444" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="444" width="6" height="82" fill="#f0883e" rx="3"/>
<circle cx="58" cy="485.0" r="13" fill="none" stroke="#f0883e" stroke-width="1.5"/>
<text x="58" y="489.5" fill="#f0883e" font-size="13" font-weight="700" text-anchor="middle">5</text>
<text x="84" y="469.0" fill="#c9d1d9" font-size="13.5">Конфликт — это сигнал: Агрессия гражданина — это не личное оскорбление, а</text>
<text x="84" y="489.0" fill="#c9d1d9" font-size="13.5">индикатор системной ошибки. Задача служащего — перевести эмоцию в конструктив,</text>
<text x="84" y="509.0" fill="#c9d1d9" font-size="13.5">используя алгоритм «присоединение → прояснение → договоренность».</text>
<rect x="28" y="538" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="538" width="6" height="82" fill="#39c5cf" rx="3"/>
<circle cx="58" cy="579.0" r="13" fill="none" stroke="#39c5cf" stroke-width="1.5"/>
<text x="58" y="583.5" fill="#39c5cf" font-size="13" font-weight="700" text-anchor="middle">6</text>
<text x="84" y="563.0" fill="#c9d1d9" font-size="13.5">Единый стандарт везде: Правила вежливого и содержательного общения одинаково</text>
<text x="84" y="583.0" fill="#c9d1d9" font-size="13.5">применимы как к бумажному ответу, так и к комментарию в социальных сетях.</text>
<text x="84" y="603.0" fill="#c9d1d9" font-size="13.5">Публичная коммуникация требует особой взвешенности.</text>
<text x="350.0" y="656" fill="#8b949e" font-size="11" text-anchor="middle">Personal OS Learning · управленческие навыки госслужащего</text>
</svg>