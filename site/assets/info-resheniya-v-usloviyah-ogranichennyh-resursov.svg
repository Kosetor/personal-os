<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 586" font-family="system-ui,sans-serif">
<rect width="700" height="586" fill="#0d1117"/>
<text x="350.0" y="34" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PERSONAL OS · КЛЮЧЕВЫЕ ТЕЗИСЫ</text>
<text x="350.0" y="52" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">Решения в условиях ограниченных ресурсов</text>
<rect x="28" y="68" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="68" width="6" height="82" fill="#3fb950" rx="3"/>
<circle cx="58" cy="109.0" r="13" fill="none" stroke="#3fb950" stroke-width="1.5"/>
<text x="58" y="113.5" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="84" y="93.0" fill="#c9d1d9" font-size="13.5">Ограниченность ресурсов — постоянное условие государственной службы, а не</text>
<text x="84" y="113.0" fill="#c9d1d9" font-size="13.5">временное отклонение; эффективный руководитель проектирует решение исходя из</text>
<text x="84" y="133.0" fill="#c9d1d9" font-size="13.5">доступных ресурсов.</text>
<rect x="28" y="162" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="162" width="6" height="62" fill="#1f6feb" rx="3"/>
<circle cx="58" cy="193.0" r="13" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
<text x="58" y="197.5" fill="#1f6feb" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="84" y="187.0" fill="#c9d1d9" font-size="13.5">Принцип Парето позволяет выделить 20% мероприятий, которые обеспечивают 80%</text>
<text x="84" y="207.0" fill="#c9d1d9" font-size="13.5">результата, и сосредоточить на них основные усилия.</text>
<rect x="28" y="236" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="236" width="6" height="62" fill="#d4a017" rx="3"/>
<circle cx="58" cy="267.0" r="13" fill="none" stroke="#d4a017" stroke-width="1.5"/>
<text x="58" y="271.5" fill="#d4a017" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text x="84" y="261.0" fill="#c9d1d9" font-size="13.5">Матрица Эйзенхауэра помогает защитить стратегически важные, но несрочные</text>
<text x="84" y="281.0" fill="#c9d1d9" font-size="13.5">задачи от вытеснения текучкой и кризисным реагированием.</text>
<rect x="28" y="310" width="644" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="310" width="6" height="82" fill="#bc8cff" rx="3"/>
<circle cx="58" cy="351.0" r="13" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
<text x="58" y="355.5" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">4</text>
<text x="84" y="335.0" fill="#c9d1d9" font-size="13.5">Анализ «затраты — выгода» и метод Кепнера-Трего обеспечивают объективность и</text>
<text x="84" y="355.0" fill="#c9d1d9" font-size="13.5">прозрачность выбора альтернатив, что защищает руководителя от субъективных</text>
<text x="84" y="375.0" fill="#c9d1d9" font-size="13.5">ошибок.</text>
<rect x="28" y="404" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="404" width="6" height="62" fill="#f0883e" rx="3"/>
<circle cx="58" cy="435.0" r="13" fill="none" stroke="#f0883e" stroke-width="1.5"/>
<text x="58" y="439.5" fill="#f0883e" font-size="13" font-weight="700" text-anchor="middle">5</text>
<text x="84" y="429.0" fill="#c9d1d9" font-size="13.5">Делегирование — ключевой инструмент управления кадровым ресурсом: оно экономит</text>
<text x="84" y="449.0" fill="#c9d1d9" font-size="13.5">время руководителя и развивает подчинённых.</text>
<rect x="28" y="478" width="644" height="62" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="478" width="6" height="62" fill="#39c5cf" rx="3"/>
<circle cx="58" cy="509.0" r="13" fill="none" stroke="#39c5cf" stroke-width="1.5"/>
<text x="58" y="513.5" fill="#39c5cf" font-size="13" font-weight="700" text-anchor="middle">6</text>
<text x="84" y="503.0" fill="#c9d1d9" font-size="13.5">Приоритеты определяются до распределения ресурсов, а не после: сначала «что</text>
<text x="84" y="523.0" fill="#c9d1d9" font-size="13.5">важно», затем «сколько это стоит».</text>
<text x="350.0" y="576" fill="#8b949e" font-size="11" text-anchor="middle">Personal OS Learning · управленческие навыки госслужащего</text>
</svg>