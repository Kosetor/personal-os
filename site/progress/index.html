<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Граф знаний — Personal OS Learning</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; }
  * { margin:0; box-sizing:border-box; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:1000px; margin:0 auto; padding:24px 16px 60px; }
  header { margin-bottom:16px; }
  .tag { color:#3fb950; font-size:12px; text-transform:uppercase; letter-spacing:.2em; }
  h1 { font-size:24px; margin:4px 0 12px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--muted);
            margin-bottom:12px; }
  .legend span::before { content:""; display:inline-block; width:12px; height:12px;
           border-radius:50%; margin-right:6px; vertical-align:-1px; }
  .g::before { background:#3fb950; } .y::before { background:#d29922; }
  .r::before { background:#f85149; } .gr::before { background:#30363d; border:1px solid #555; }
  #graph { background:#0d1117; border:1px solid var(--line); border-radius:12px; }
  .node circle { stroke:#fff; stroke-width:1.5; cursor:pointer; }
  .node text { fill:var(--fg); font-size:11px; pointer-events:none; }
  .link { stroke:#30363d; stroke-opacity:.6; }
  .back { display:inline-block; margin-top:16px; color:#1f6feb; text-decoration:none; font-size:14px; }
  .summary { margin-top:12px; color:var(--muted); font-size:14px; line-height:1.7; }
  .summary b { color:var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag">Personal OS Learning · прогресс</div>
    <h1>Граф тем: управленческие компетенции</h1>
    <div class="legend">
      <span class="g">изучено и закреплено</span>
      <span class="y">изучено, слабо закреплено</span>
      <span class="r">проблемная</span>
      <span class="gr">не изучено</span>
    </div>
  </header>
  <svg id="graph" width="100%" height="560"></svg>
  <div class="summary" id="summary">Загрузка…</div>
  <a class="back" href="../index.html">← На главную</a>
</div>

<script src="../vendor/d3.min.js"></script>
<script>
const COLORS = { green:"#3fb950", yellow:"#d29922", red:"#f85149", grey:"#30363d" };

async function load() {
  const [g, p] = await Promise.all([
    fetch("../data/knowledge-graph.json").then(r => r.json()),
    fetch("../data/progress-public.json").then(r => r.json()),
  ]);

  const nodes = g.nodes.map(n => ({ id: n.id, label: n.label, status: n.status }));
  const links = g.edges.map(e => ({ source: e.from, target: e.to }));

  // сводка
  const st = p.by_status;
  document.getElementById("summary").innerHTML =
    `Изучено тем: <b>${p.studied}</b> из ${p.total_topics} · ` +
    `закреплено: <b>${st.green || 0}</b>, в работе: <b>${st.yellow || 0}</b>, ` +
    `проблемных: <b>${st.red || 0}</b>`;

  const width = document.getElementById("graph").clientWidth;
  const height = 560;

  const svg = d3.select("#graph");
  svg.selectAll("*").remove();
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(90))
    .force("charge", d3.forceManyBody().strength(-420))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collide", d3.forceCollide(55));

  const link = svg.append("g").selectAll("line")
    .data(links).join("line").attr("class", "link");

  const node = svg.append("g").selectAll("g")
    .data(nodes).join("g").call(d3.drag()
      .on("start", dragStart).on("drag", dragged).on("end", dragEnd));

  node.append("circle")
    .attr("r", d => d.status === "grey" ? 9 : 13)
    .attr("fill", d => COLORS[d.status] || COLORS.grey)
    .on("click", (e, d) => { e.stopPropagation(); highlight(d); });

  node.append("text")
    .text(d => d.label)
    .attr("x", 18).attr("y", 4);

  sim.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  function highlight(d) {
    const connected = new Set([d.id]);
    links.forEach(l => {
      if (l.source.id === d.id) connected.add(l.target.id);
      if (l.target.id === d.id) connected.add(l.source.id);
    });
    node.select("circle").attr("opacity", n => connected.has(n.id) ? 1 : 0.15);
    node.select("text").attr("opacity", n => connected.has(n.id) ? 1 : 0.15);
    link.attr("opacity", l =>
      (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.08);
  }

  function dragStart(e, d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
  function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
  function dragEnd(e, d) { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }
}
load();
</script>
</body>
</html>
